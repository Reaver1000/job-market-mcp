[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-mcp"
version = "0.1.0"
description = "An MCP server and Claude skill over a daily snapshot of public job postings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Buchan", email = "davidbuchan1000@googlemail.com" }]
keywords = ["mcp", "claude", "jobs", "labour-market", "data"]
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
job-market-mcp = "job_market_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
